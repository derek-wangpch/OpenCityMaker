<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Shanghai model review</title>
  <style>
    body {
      margin: 0;
      background: #fff;
    }
    canvas {
      display: block;
      width: 460px;
      height: 560px;
    }
  </style>
  <canvas></canvas>
  <script type="module">
    import { SceneView } from "/src/scene/render.ts";
    import { shanghai } from "/src/cities/shanghai.ts";
    const view = new SceneView(document.querySelector("canvas"), "model");
    const position = view.camera.position.clone(),
      up = view.camera.up.clone(),
      quaternion = view.camera.quaternion.clone();
    window.__show = (tier, elevation) => {
      view.model(shanghai, 2 ** tier);
      view.camera.position.copy(position);
      view.camera.up.copy(up);
      view.camera.quaternion.copy(quaternion);
      if (elevation === "top") {
        view.camera.up.set(0, 0, -1);
        view.camera.position.set(0, 12, 0);
        view.camera.lookAt(0, 0, 0);
      } else if (elevation !== "default") {
        view.camera.position.set(
          elevation === "side" ? 12 : 0,
          1.25,
          elevation === "side" ? 0 : 12,
        );
        view.camera.lookAt(0, 1.25, 0);
      }
      view.renderer.render(view.scene, view.camera);
    };
    window.__show(9, "default");
    window.addEventListener("pagehide", () => view.dispose(), { once: true });
    window.__done = true;
  </script>
</html>
