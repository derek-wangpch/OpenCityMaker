<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f3eb" />
    <script>
      (() => {
        let preference = "system";
        try {
          const saved = localStorage.getItem("citymaker:theme");
          if (saved === "light" || saved === "dark" || saved === "system")
            preference = saved;
        } catch {}
        const dark =
          preference === "dark" ||
          (preference === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        const theme = dark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#171c1a" : "#f5f3eb");
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CityMaker" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="description"
      content="A little merge. A growing city. Build Beijing and Hong Kong in an original 3D landmark puzzle."
    />
    <title>CityMaker — A little merge. A growing city.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores the manifest icons when adding a page to the Home Screen. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
